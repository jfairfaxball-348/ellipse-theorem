# Palomar formalization metadata v0.4. Prospective paper/registry title; no registration has occurred.
version: "v0.4"

project:
  name: "Noncrossing Two-Nearest-Predecessor Orders on Nearly Circular Ellipses"
  description: >-
    We prove a uniform all-cardinality existence theorem for noncrossing
    chronological two-nearest-predecessor graphs on sufficiently near-circular
    ellipses. Put R = sqrt(2/sin(2*pi/5) - 1). For every ellipse with
    semiaxes a >= b > 0 and a/b <= R, and every finite set of at least
    three distinct boundary sites, there is an order starting with a
    triangle in which every subsequent site is joined to exactly its two
    Euclidean-nearest earlier sites. All edges persist, and no two
    independent edges properly cross. Cartesian-lexicographic order resolves
    equal-distance predecessor ties. The sufficient ratio bound includes
    equality, all finite cardinalities and arbitrarily close distinct sites.
    The interest lies in planarity despite compulsory distance-ranked edges:
    unlike conventional convex-polygon triangulation, the two incoming
    edges cannot be chosen just to avoid crossings. The constructive proof
    uses recursive metric-ear deletion; the accompanying manuscript also
    gives an exact-real comparison-model algorithm, whose complexity is not
    a separately compared Lean claim. The bound is not claimed to be sharp;
    historical priority remains unestablished. The repository also contains
    formally proved supporting geometry and a concrete noncircular
    corollary, but these are not submitted as independent research results
    in the selected Comparator configuration.
  authors:
    - "John Fairfax-Ball"
  license: "Apache-2.0"
  responsible_maintainers:
    - "John Fairfax-Ball"

